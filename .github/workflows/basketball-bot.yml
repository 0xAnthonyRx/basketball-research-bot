name: Basketball Research Bot

# Run every Tuesday and Thursday at 11 AM EST
on:
  schedule:
    # Tuesday at 11 AM EST (4 PM UTC during standard time, 3 PM UTC during daylight saving)
    - cron: '0 16 * * 2'  # Standard time (Nov-Mar)
    - cron: '0 15 * * 2'  # Daylight saving (Mar-Nov)
    
    # Thursday at 11 AM EST
    - cron: '0 16 * * 4'  # Standard time (Nov-Mar)
    - cron: '0 15 * * 4'  # Daylight saving (Mar-Nov)
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client python-dateutil
    
    - name: Create credentials.json from secret
      run: |
        echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json
    
    - name: Create token.pickle from secret (if exists)
      run: |
        if [ ! -z "${{ secrets.GMAIL_TOKEN }}" ]; then
          echo '${{ secrets.GMAIL_TOKEN }}' | base64 -d > token.pickle
        fi
    
    - name: Run Basketball Research Bot
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python basketball_research_bot.py
    
    - name: Save token.pickle to secrets (for next run)
      if: always()
      run: |
        if [ -f token.pickle ]; then
          echo "Token file exists, should be updated in secrets manually"
        fi
    
    - name: Upload logs (if any errors)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: error-logs
        path: |
          *.log
          *.txt
